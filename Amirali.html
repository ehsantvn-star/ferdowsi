<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کارت‌پستال شاهنامه - امیرعلی فیلونژاد</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #060913;
            font-family: "Vazirmatn", Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            color: #f8fafc;
        }

        /* بدنه کارت‌پستال متناسب با ابعاد تصویر */
        .postcard {
            width: 100%;
            max-width: 440px;
            background: radial-gradient(circle at 50% 15%, #172554 0%, #080d1a 100%);
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(212, 175, 55, 0.4);
            position: relative;
            padding: 16px 14px 14px 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }

        /* حاشیه دوبل طلایی تذهیبی */
        .postcard::before {
            content: "";
            position: absolute;
            inset: 6px;
            border: 2px solid #d4af37;
            border-radius: 9px;
            pointer-events: none;
            opacity: 0.85;
            z-index: 10;
        }

        .postcard::after {
            content: "";
            position: absolute;
            inset: 10px;
            border: 1px dashed rgba(212, 175, 55, 0.45);
            border-radius: 6px;
            pointer-events: none;
            z-index: 10;
        }

        /* گوشه‌های تذهیبی */
        .corner-accent {
            position: absolute;
            width: 16px;
            height: 16px;
            border: 3px solid #d4af37;
            pointer-events: none;
            z-index: 11;
        }
        .corner-tl { top: 12px; right: 12px; border-bottom: none; border-left: none; }
        .corner-tr { top: 12px; left: 12px; border-bottom: none; border-right: none; }
        .corner-bl { bottom: 12px; right: 12px; border-top: none; border-left: none; }
        .corner-br { bottom: 12px; left: 12px; border-top: none; border-right: none; }

        /* دکمه کنترل صوت */
        .audio-bar {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 20;
        }

        .ctrl-btn {
            background: rgba(10, 15, 30, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.7);
            color: #fef08a;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 7.5pt;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: all 0.2s ease;
        }

        /* عنوان بالای کارت */
        .header {
            text-align: center;
            position: relative;
            z-index: 3;
            margin-top: 4px;
        }

        .bismillah {
            font-size: 13pt;
            font-weight: 800;
            color: #f59e0b;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.35);
        }

        .sub-title {
            font-size: 7.5pt;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* کادر تصویر کارت‌پستال */
        .image-container {
            position: relative;
            z-index: 3;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
        }

        .image-container img {
            width: 100%;
            height: auto;
            max-height: 480px;
            object-fit: contain;
            display: block;
            border-radius: 7px;
        }

        /* کادر مشخصات امیرعلی فیلونژاد */
        .student-footer {
            position: relative;
            z-index: 12;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 7px;
            padding: 5px 6px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            font-size: 7pt;
            gap: 4px;
            width: 100%;
        }

        .student-footer .info-box {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 4px;
            padding: 2px 6px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .student-footer .label {
            color: #94a3b8;
        }

        .student-footer .value {
            color: #f59e0b;
            font-weight: 700;
        }

        .ltr-text {
            direction: ltr;
            display: inline-block;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- المان صوت با ارجاع به هر دو فرمت نام فایل صوتی -->
    <audio id="poemAudio" preload="auto">
        <source src="Voice.mp3" type="audio/mpeg">
        <source src="voice.mp3" type="audio/mpeg">
    </audio>

    <div class="postcard">
        <!-- دکمه کنترل صوت -->
        <div class="audio-bar">
            <button class="ctrl-btn" id="audioToggle">
                <span id="audioIcon">▶</span>
                <span id="audioText">پخش ویس</span>
            </button>
        </div>

        <div class="corner-accent corner-tl"></div>
        <div class="corner-accent corner-tr"></div>
        <div class="corner-accent corner-bl"></div>
        <div class="corner-accent corner-br"></div>

        <!-- سربرگ -->
        <div class="header">
            <div class="bismillah">شاهنامه فردوسی</div>
            <div class="sub-title">در ستایش جان، خرد و دانایی</div>
        </div>

        <!-- قاب اختصاصی تصویر شما -->
        <div class="image-container">
            <img src="image.jpg" 
                 id="postcardImg" 
                 alt="کارت‌پستال فردوسی"
                 onerror="if (this.src.indexOf('card.jpg') === -1) this.src = 'card.jpg';">
        </div>

        <!-- کادر مشخصات استاندارد -->
        <div class="student-footer">
            <div class="info-box">
                <span class="label">تهیه‌کننده:</span>
                <span class="value">امیرعلی فیلونژاد</span>
            </div>

            <div class="info-box">
                <span class="label">کلاس:</span>
                <span class="value ltr-text">8/2</span>
            </div>

            <div class="info-box">
                <span class="label">دبیر ارجمند:</span>
                <span class="value">استاد زاهدی</span>
            </div>
        </div>
    </div>

    <!-- اسکریپت پخش با اولین لمس هر نقطه از صفحه -->
    <script>
        const audio = document.getElementById('poemAudio');
        const audioBtn = document.getElementById('audioToggle');
        const audioIcon = document.getElementById('audioIcon');
        const audioText = document.getElementById('audioText');

        function updateUI(isPlaying) {
            if (isPlaying) {
                audioIcon.textContent = '❚❚';
                audioText.textContent = 'توقف ویس';
            } else {
                audioIcon.textContent = '▶';
                audioText.textContent = 'پخش ویس';
            }
        }

        // با اولین لمس یا کلیک روی صفحه، ویس پخش می‌شود
        function enableAudioOnTouch() {
            const startPlay = () => {
                if (audio.paused) {
                    audio.play().then(() => updateUI(true)).catch(() => {});
                }
                window.removeEventListener('click', startPlay);
                window.removeEventListener('touchstart', startPlay);
            };

            window.addEventListener('click', startPlay);
            window.addEventListener('touchstart', startPlay, { passive: true });
        }

        window.addEventListener('DOMContentLoaded', enableAudioOnTouch);

        audioBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (audio.paused) {
                audio.play().then(() => updateUI(true));
            } else {
                audio.pause();
                updateUI(false);
            }
        });

        audio.addEventListener('ended', () => updateUI(false));
    </script>
</body>
</html>
